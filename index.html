    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        background: #f5f5f5;
      }

      /* Owner badge */
      .owner-badge {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        z-index: 1000;
        padding: 12px 18px;
        animation: slideIn 0.3s ease-out;
        will-change: transform, opacity;
      }
      .owner-badge p {
        color: #151617;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
      }
      .owner-badge span { font-weight: 700; }
      .owner-badge.hide { animation: slideOut 0.3s ease-out forwards; }

      @keyframes slideIn {
        from { transform: translateY(100px) translateZ(0); opacity: 0; }
        to { transform: translateY(0) translateZ(0); opacity: 1; }
      }
      @keyframes slideOut {
        to { transform: translateY(100px) translateZ(0); opacity: 0; }
      }

      .iframe-container { flex: 1; position: relative; background: white; overflow: hidden; min-height: 0; }
      iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; }
    </style>
  </head>
  <body>
    <div class="owner-badge" id="owner-badge">
      <p>Owner - <span>SachinCoderX</span></p>
    </div>

    <div class="iframe-container">
      <iframe
        id="preview-iframe"
        src="https://01a10261-4c24-7bf3-b9f3-1f79a70d8842.arena.site/?embed=true"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-popups allow-popups-to-escape-sandbox allow-downloads allow-top-navigation-by-user-activation"
        allow="accelerometer; autoplay; camera; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; clipboard-read; clipboard-write; usb; vr; xr-spatial-tracking; screen-wake-lock; magnetometer; ambient-light-sensor; battery; gamepad; picture-in-picture; display-capture; bluetooth;"
        referrerpolicy="origin-when-cross-origin"
      ></iframe>
    </div>

    <script>
      const iframe = document.getElementById("preview-iframe");
      iframe.addEventListener("load", () => iframe.focus());

      // 5 second baad badge apne aap hat jayega
      setTimeout(() => {
        const badge = document.getElementById("owner-badge");
        if (!badge) return;
        badge.classList.add("hide");
        setTimeout(() => badge.remove(), 300);
      }, 5000);
    </script>
  </body>
